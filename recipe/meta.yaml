{% set name = "nbsphinx-link" %}
{% set version = "1.4.1" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name | replace('-', '_') }}-{{ version }}.tar.gz
  sha256: 566d5640c165627dc3ae8442a9424ae89cc4af9794261737d8b16bb6717597b8

build:
  number: 0
  script: "{{ PYTHON }} -m pip install . -vv"
  noarch: python

requirements:
  host:
    - python >=3.0
    - pip
    - setuptools
  run:
    - python >=3.0
    - nbsphinx
    - sphinx >=1.8

test:
  imports:
    - nbsphinx_link

about:
  home: https://github.com/vidartf/nbsphinx-link/
  license: BSD-3-Clause
  license_file: LICENSE
  summary: 'A sphinx extension for including notebook files from outside the sphinx source root.'

extra:
  recipe-maintainers:
    - marimeireles
    - wolfv
